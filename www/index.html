<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <title>WebToApp</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 360px);
        text-align: center;
      }

      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: #2563eb;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-size: 26px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.4px;
      }

      p {
        margin: 8px 0 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">W</div>
      <h1>WebToApp</h1>
      <p>Menyiapkan aplikasi. Jika halaman ini tetap tampil, periksa koneksi internet atau konfigurasi URL website.</p>
    </main>
  </body>
</html>
