<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koneksi Terputus</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #F8FAFC;
            color: #0F172A;
            text-align: center;
            padding: 24px;
            user-select: none;
        }
        .icon-container {
            width: 80px;
            height: 80px;
            background-color: #EFF6FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .icon {
            font-size: 40px;
            line-height: 1;
        }
        h1 { 
            font-size: 22px; 
            font-weight: 700; 
            margin: 0 0 12px 0; 
            color: #1E40AF; 
        }
        p { 
            font-size: 14px; 
            color: #64748B; 
            max-width: 280px; 
            line-height: 1.6;
            margin: 0;
        }
        button {
            margin-top: 32px;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            background-color: #2563EB;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="icon-container">
        <div class="icon">📡</div>
    </div>
    <h1>Koneksi Terputus</h1>
    <p>Sepertinya perangkatmu tidak terhubung ke internet. Silakan nyalakan data seluler atau Wi-Fi untuk melanjutkan.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
</body>
</html>
