name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
      appName:
        description: 'App Name'
        required: true
      logoBase64:
        description: 'Logo Base64'
        required: true
      themeColor:
        description: 'Theme Color'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Inject app configuration
        run: node scripts/inject-config.js
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_APPNAME: ${{ github.event.inputs.appName }}
          INPUT_LOGO_BASE64: ${{ github.event.inputs.logoBase64 }}
          INPUT_THEMECOLOR: ${{ github.event.inputs.themeColor }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare debug signing key
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
